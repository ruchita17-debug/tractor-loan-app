<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🚜 Tractor Loan Calculator</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#36d1dc;
color:white;
border:none;
font-size:16px;
}

.result{
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>🚜 Tractor Loan Calculator</h2>

<label>Invoice Amount</label>
<input type="number" id="invoice">

<label>Year of Manufacture</label>
<input type="number" id="year">

<button onclick="estimateLoan()">Estimate Loan Amount</button>

<div class="result">

<p id="age"></p>
<p id="depreciation"></p>
<p id="loanAmount"></p>

</div>

<div id="loanSection" style="display:none">

<label>Interest Rate (%)</label>
<input type="number" id="rate">

<label>Loan Years</label>
<input type="number" id="years">

<button onclick="calculateEMI()">Calculate EMI</button>

</div>

<div class="result">

<p id="emi"></p>
<p id="total"></p>
<p id="interest"></p>

</div>

</div>

<script>

let loanValue=0;

function estimateLoan(){

let invoice=parseFloat(document.getElementById("invoice").value);
let year=parseInt(document.getElementById("year").value);

let currentYear=new Date().getFullYear();
let age=currentYear-year;

let depreciation=0;

if(age==0) depreciation=0;
else if(age==1) depreciation=20;
else if(age==2) depreciation=25;
else depreciation=25+(age-2)*5;

let value=invoice-(invoice*(depreciation/100));

loanValue=value*0.8;

document.getElementById("age").innerHTML="Age: "+age+" years";
document.getElementById("depreciation").innerHTML="Depreciation: "+depreciation+"%";
document.getElementById("loanAmount").innerHTML="Estimated Loan: ₹ "+Math.round(loanValue);

document.getElementById("loanSection").style.display="block";

}

function calculateEMI(){

let rate=parseFloat(document.getElementById("rate").value)/100/12;
let months=parseFloat(document.getElementById("years").value)*12;

let emi=(loanValue*rate*Math.pow(1+rate,months))/(Math.pow(1+rate,months)-1);

let total=emi*months;
let interest=total-loanValue;

document.getElementById("emi").innerHTML="Monthly EMI: ₹ "+Math.round(emi);
document.getElementById("total").innerHTML="Total Payment: ₹ "+Math.round(total);
document.getElementById("interest").innerHTML="Total Interest: ₹ "+Math.round(interest);

}

</script>

</body>
</html>
